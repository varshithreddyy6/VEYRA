[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-fraud-detection-system"
version = "1.0.0"
description = "End-to-end credit card fraud screening prototype: XGBoost + SHAP + FastAPI + React"
readme = "../README.md"
requires-python = ">=3.11"
authors = [{ name = "Varshith Reddy", email = "varshithreddyy6@gmail.com" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["app*", "fraud_detector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501"]
