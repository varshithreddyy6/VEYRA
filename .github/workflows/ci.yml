# CI for the CREDIT CARD FRAUD DETECTION SYSTEM
#
# Runs on push/PR: backend deps + lint-ish compile + full pytest suite,
# frontend install + typecheck + vitest + production build, and a Docker
# build smoke check. Nothing here claims deployment or production metrics.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + artifacts check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile (syntax check) application modules
        run: python -m compileall -q app fraud_detector train_model.py

      - name: Run backend test suite
        run: pytest -q

      - name: Verify training pipeline runs (synthetic data, fast path)
        run: |
          export FRAUD_ARTIFACTS_DIR=$RUNNER_TEMP/artifacts
          export FRAUD_RESULTS_DIR=$RUNNER_TEMP/results
          export FRAUD_DATA_DIR=$RUNNER_TEMP/data
          python train_model.py --fake --no-tuning --no-shap --skip-eda

      - name: Verify migration applies on a scratch SQLite database
        run: |
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/ci.db"
          alembic upgrade head

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check
        run: npx tsc -b

      - name: Run frontend tests
        run: npm run test

      - name: Production build
        run: npm run build

  docker:
    name: Docker build smoke check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t ccdfs-api-test ./backend
      - name: Build frontend image
        run: docker build -t ccdfs-frontend-test ./frontend
